<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Generate 3D Model</title>
<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #111; color: #eee; min-height: 100vh; }
  #app { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px;
           padding-bottom: 16px; border-bottom: 1px solid #222; }
  header h1 { font-size: 1.2rem; font-weight: 600; }
  .back { color: #888; font-size: 13px; background: none; border: none;
          cursor: pointer; padding: 0; text-decoration: none; }
  .back:hover { color: #eee; }
  section { margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; font-weight: 500; }
  input[type=text], input[type=password] {
    width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a;
    border-radius: 8px; padding: 9px 12px; color: #eee; font-size: 14px; }
  input[type=text]:focus, input[type=password]:focus { outline: none; border-color: #444; }

  /* model tabs */
  .model-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { font-size: 13px; font-weight: 500; padding: 6px 16px;
         border: 1px solid #2a2a2a; border-radius: 20px;
         background: transparent; color: #888; cursor: pointer;
         transition: border-color 0.15s, color 0.15s, background 0.15s; }
  .tab:hover { border-color: #444; color: #ccc; }
  .tab.active { background: #eee; color: #111; border-color: #eee; }
  .tab-desc { font-size: 12px; color: #555; margin-bottom: 20px; }

  /* multi-view grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dropzone { border: 1px dashed #333; border-radius: 10px; aspect-ratio: 1;
              display: flex; flex-direction: column; align-items: center;
              justify-content: center; gap: 6px; cursor: pointer;
              transition: border-color 0.15s, background 0.15s;
              position: relative; overflow: hidden; background: #161616; }
  .dropzone:hover { border-color: #555; background: #1a1a1a; }
  .dropzone.has-image { border-style: solid; border-color: #444; }
  .dropzone img { position: absolute; inset: 0; width: 100%; height: 100%;
                  object-fit: cover; border-radius: 9px; }
  .dropzone .label { font-size: 11px; color: #666; font-weight: 500;
                     position: relative; z-index: 1; }
  .dropzone .required-badge { position: absolute; top: 6px; right: 6px;
    background: #333; color: #aaa; font-size: 9px; padding: 2px 5px;
    border-radius: 4px; font-weight: 600; letter-spacing: 0.05em; z-index: 2; }
  .dropzone .clear-btn { position: absolute; top: 6px; left: 6px; z-index: 3;
    background: rgba(0,0,0,0.6); border: none; color: #eee; border-radius: 50%;
    width: 22px; height: 22px; cursor: pointer; font-size: 13px;
    display: none; align-items: center; justify-content: center; }
  .dropzone.has-image .clear-btn { display: flex; }
  input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  /* single dropzone */
  .dropzone-single { border: 1px dashed #333; border-radius: 10px; min-height: 180px;
                     display: flex; flex-direction: column; align-items: center;
                     justify-content: center; gap: 8px; cursor: pointer;
                     transition: border-color 0.15s, background 0.15s;
                     position: relative; overflow: hidden; background: #161616; }
  .dropzone-single:hover { border-color: #555; background: #1a1a1a; }
  .dropzone-single.has-image { border-style: solid; border-color: #444; }
  .dropzone-single img { position: absolute; inset: 0; width: 100%; height: 100%;
                         object-fit: contain; padding: 12px; }
  .dropzone-single .label { font-size: 13px; color: #555; font-weight: 500;
                             position: relative; z-index: 1; }
  .dropzone-single .sub { font-size: 11px; color: #444; position: relative; z-index: 1; }
  .dropzone-single .clear-btn { position: absolute; top: 8px; right: 8px; z-index: 3;
    background: rgba(0,0,0,0.6); border: none; color: #eee; border-radius: 50%;
    width: 22px; height: 22px; cursor: pointer; font-size: 13px;
    display: none; align-items: center; justify-content: center; }
  .dropzone-single.has-image .clear-btn { display: flex; }

  .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 10px;
         font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .btn-primary { background: #fff; color: #111; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-outline { background: transparent; color: #ddd; border: 1px solid #333;
                 font-size: 14px; font-weight: 500; }
  .btn-outline:hover { border-color: #555; }

  #steps { display: flex; flex-direction: column; gap: 8px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 13px;
          color: #666; padding: 8px 12px; border-radius: 8px; background: #161616; }
  .step.active { color: #eee; background: #1e1e1e; }
  .step.done { color: #4ade80; }
  .step.error { color: #f87171; }
  .step-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }

  #preview-wrap { border-radius: 12px; overflow: hidden; background: #161616;
                  border: 1px solid #222; }
  #preview-wrap canvas { display: block; width: 100% !important; height: auto !important;
                          aspect-ratio: 4/3; }
  .result-actions { display: flex; gap: 10px; margin-top: 12px; }
  .result-actions .btn { flex: 1; }
  .hint { font-size: 12px; color: #555; margin-top: 6px; }
  #status-msg { font-size: 13px; color: #888; min-height: 18px; }
  #status-msg.error { color: #f87171; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@fal-ai/client": "https://esm.sh/@fal-ai/client"
  }
}
</script>
</head>
<body>
<div id="app">
  <header>
    <button class="back" onclick="history.back()">← Catalog</button>
    <h1>Generate 3D Model</h1>
  </header>

  <!-- Model tabs -->
  <div class="model-tabs">
    <button class="tab active" data-model="hunyuan">Hunyuan3D</button>
    <button class="tab" data-model="meshy">Meshy v6</button>
    <button class="tab" data-model="tripo">Tripo v2.5</button>
  </div>
  <p class="tab-desc" id="model-desc">Multi-view · High quality · Up to 8 angles</p>

  <!-- fal.ai API key (shared by all models) -->
  <section>
    <label>fal.ai API Key</label>
    <input type="password" id="api-key" placeholder="key-xxxxxxxxxxxxxxxx"
           autocomplete="off" spellcheck="false">
    <p class="hint">All models run via fal.ai — one key for all three. Get yours at
      <a href="https://fal.ai/dashboard" target="_blank" style="color:#888">fal.ai/dashboard</a>.
    </p>
  </section>

  <!-- Hunyuan: multi-view -->
  <section id="images-multi">
    <label>Reference Images — front is required; more views = better quality</label>
    <div class="grid">
      <div class="dropzone" data-slot="front">
        <span class="required-badge">REQUIRED</span>
        <button class="clear-btn" type="button" aria-label="Remove">×</button>
        <input type="file" accept="image/*">
        <span class="label">Front view</span>
      </div>
      <div class="dropzone" data-slot="back">
        <button class="clear-btn" type="button" aria-label="Remove">×</button>
        <input type="file" accept="image/*">
        <span class="label">Back (optional)</span>
      </div>
      <div class="dropzone" data-slot="left">
        <button class="clear-btn" type="button" aria-label="Remove">×</button>
        <input type="file" accept="image/*">
        <span class="label">Left (optional)</span>
      </div>
      <div class="dropzone" data-slot="right">
        <button class="clear-btn" type="button" aria-label="Remove">×</button>
        <input type="file" accept="image/*">
        <span class="label">Right (optional)</span>
      </div>
    </div>
  </section>

  <!-- Meshy / Tripo: single image -->
  <section id="images-single" style="display:none">
    <label>Reference Image — clean front-view photo recommended</label>
    <div class="dropzone-single" id="dz-single">
      <button class="clear-btn" type="button" aria-label="Remove">×</button>
      <input type="file" accept="image/*">
      <span class="label">Drop or click to upload</span>
      <span class="sub">Best results: white/neutral background, full object visible</span>
    </div>
  </section>

  <section>
    <button class="btn btn-primary" id="generate-btn" disabled>Generate 3D</button>
  </section>

  <section id="progress-section" style="display:none">
    <div id="steps"></div>
    <p id="status-msg" style="margin-top:12px"></p>
  </section>

  <section id="result-section" style="display:none">
    <div id="preview-wrap"><canvas id="preview-canvas"></canvas></div>
    <div class="result-actions">
      <button class="btn btn-primary" id="ar-btn" type="button">Open in AR</button>
      <button class="btn btn-outline" id="save-btn" type="button">Save to Library</button>
    </div>
  </section>
</div>

<script type="module">
import { fal } from '@fal-ai/client';
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- model definitions ----------------------------------------------------
const MODELS = {
  hunyuan: {
    label: 'Hunyuan3D',
    desc: 'Multi-view · High quality · Up to 8 angles',
    endpoint: 'fal-ai/hunyuan-3d/v3.1/pro/image-to-3d',
    multiView: true,
    extractGlb: d => d?.model_glb?.url || d?.model_urls?.glb?.url || d?.model_urls?.glb,
  },
  meshy: {
    label: 'Meshy v6',
    desc: 'Fast · PBR textures · Multiple export formats',
    endpoint: 'fal-ai/meshy/v6/image-to-3d',
    multiView: false,
    extractGlb: d => d?.model_glb?.url || d?.model_urls?.glb?.url || d?.model_urls?.glb,
  },
  tripo: {
    label: 'Tripo v2.5',
    desc: 'Fast · Affordable · PBR materials',
    endpoint: 'tripo3d/tripo/v2.5/image-to-3d',
    multiView: false,
    extractGlb: d => d?.model_mesh?.url || d?.pbr_model?.url,
  },
};

let currentModel = 'hunyuan';

// ---- image state ----------------------------------------------------------
const multiFiles = { front: null, back: null, left: null, right: null };
let singleFile = null;
let resultGlbUrl = null;
let resultName = 'Generated Model';

// ---- API key --------------------------------------------------------------
const keyInput = document.getElementById('api-key');
keyInput.value = localStorage.getItem('fal_api_key') || '';
keyInput.addEventListener('change', () =>
  localStorage.setItem('fal_api_key', keyInput.value.trim()));

// ---- model tabs -----------------------------------------------------------
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentModel = btn.dataset.model;
    applyModel();
  });
});

function applyModel() {
  const m = MODELS[currentModel];
  document.getElementById('model-desc').textContent = m.desc;
  document.getElementById('images-multi').style.display  = m.multiView ? '' : 'none';
  document.getElementById('images-single').style.display = m.multiView ? 'none' : '';
  updateGenerateBtn();
}

// ---- multi-view dropzones -------------------------------------------------
document.querySelectorAll('#images-multi .dropzone').forEach(dz => {
  const slot = dz.dataset.slot;
  const fi   = dz.querySelector('input[type=file]');
  const clr  = dz.querySelector('.clear-btn');

  fi.addEventListener('change', () => {
    const f = fi.files[0]; if (!f) return;
    multiFiles[slot] = f; setDropPreview(dz, f); updateGenerateBtn();
  });
  clr.addEventListener('click', e => {
    e.stopPropagation(); multiFiles[slot] = null; fi.value = '';
    clearDropPreview(dz); updateGenerateBtn();
  });
  bindDrag(dz, f => { multiFiles[slot] = f; fi.value = ''; setDropPreview(dz, f); updateGenerateBtn(); });
});

// ---- single dropzone ------------------------------------------------------
const dzSingle = document.getElementById('dz-single');
const sfi = dzSingle.querySelector('input[type=file]');
const sclr = dzSingle.querySelector('.clear-btn');

sfi.addEventListener('change', () => {
  singleFile = sfi.files[0] || null;
  if (singleFile) setDropPreview(dzSingle, singleFile); else clearDropPreview(dzSingle);
  updateGenerateBtn();
});
sclr.addEventListener('click', e => {
  e.stopPropagation(); singleFile = null; sfi.value = '';
  clearDropPreview(dzSingle); updateGenerateBtn();
});
bindDrag(dzSingle, f => { singleFile = f; sfi.value = ''; setDropPreview(dzSingle, f); updateGenerateBtn(); });

function setDropPreview(dz, file) {
  let img = dz.querySelector('img');
  if (!img) { img = document.createElement('img'); dz.prepend(img); }
  img.src = URL.createObjectURL(file);
  dz.classList.add('has-image');
}
function clearDropPreview(dz) {
  const img = dz.querySelector('img');
  if (img) { URL.revokeObjectURL(img.src); img.remove(); }
  dz.classList.remove('has-image');
}
function bindDrag(dz, onFile) {
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.borderColor = '#666'; });
  dz.addEventListener('dragleave', () => { dz.style.borderColor = ''; });
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.style.borderColor = '';
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) onFile(f);
  });
}
function updateGenerateBtn() {
  const ready = MODELS[currentModel].multiView ? !!multiFiles.front : !!singleFile;
  document.getElementById('generate-btn').disabled = !ready;
}

// ---- steps UI -------------------------------------------------------------
const STEPS = [
  { id: 'upload',   icon: '⬆', label: 'Uploading image…'      },
  { id: 'queue',    icon: '⏳', label: 'Queued…'               },
  { id: 'generate', icon: '⚙', label: 'Generating 3D model…'  },
  { id: 'download', icon: '⬇', label: 'Fetching result…'      },
];
function buildSteps() {
  const c = document.getElementById('steps'); c.innerHTML = '';
  STEPS.forEach(s => {
    const el = document.createElement('div');
    el.className = 'step'; el.id = 'step-' + s.id;
    el.innerHTML = `<span class="step-icon">${s.icon}</span><span>${s.label}</span>`;
    c.appendChild(el);
  });
}
const statusMsg = document.getElementById('status-msg');
const setStatus = s => { statusMsg.textContent = s; statusMsg.className = ''; };
const setError  = s => { statusMsg.textContent = s; statusMsg.className = 'error'; };
const stepDone   = id => { const el = document.getElementById('step-' + id); if (el) { el.className = 'step done'; el.querySelector('.step-icon').textContent = '✓'; } };
const stepActive = id => { const el = document.getElementById('step-' + id); if (el) el.className = 'step active'; };

// ---- generate -------------------------------------------------------------
document.getElementById('generate-btn').addEventListener('click', generate);

async function generate() {
  const key = keyInput.value.trim();
  if (!key) { alert('Enter your fal.ai API key first.'); keyInput.focus(); return; }
  localStorage.setItem('fal_api_key', key);
  fal.config({ credentials: key });

  document.getElementById('generate-btn').disabled = true;
  document.getElementById('progress-section').style.display = '';
  document.getElementById('result-section').style.display = 'none';
  buildSteps();

  try {
    const model = MODELS[currentModel];

    // 1. upload
    stepActive('upload');
    let input;
    if (model.multiView) {
      setStatus('Uploading front view…');
      input = { input_image_url: await fal.storage.upload(multiFiles.front) };
      for (const [slot, key] of [['back','back_image_url'],['left','left_image_url'],['right','right_image_url']]) {
        if (!multiFiles[slot]) continue;
        setStatus(`Uploading ${slot} view…`);
        input[key] = await fal.storage.upload(multiFiles[slot]);
      }
    } else {
      setStatus('Uploading image…');
      input = { image_url: await fal.storage.upload(singleFile) };
    }
    stepDone('upload');

    // 2-3. queue + generate
    stepActive('queue');
    setStatus(`Submitting to ${model.label}…`);
    let inProgress = false;

    const result = await fal.subscribe(model.endpoint, {
      input,
      logs: true,
      onQueueUpdate: update => {
        if (update.status === 'IN_QUEUE')
          setStatus(`Queue position: ${update.queue_position ?? '…'}`);
        if (update.status === 'IN_PROGRESS' && !inProgress) {
          stepDone('queue'); stepActive('generate'); inProgress = true;
        }
        if (update.status === 'IN_PROGRESS') {
          const msg = update.logs?.at(-1)?.message; if (msg) setStatus(msg);
        }
      },
    });
    stepDone('generate');

    // 4. extract GLB URL
    stepActive('download');
    const data = result?.data ?? result;
    const glbUrl = model.extractGlb(data);
    if (!glbUrl) throw new Error(
      `No GLB URL in response. Raw: ${JSON.stringify(data).slice(0, 300)}`
    );
    stepDone('download');

    resultGlbUrl = glbUrl;
    resultName = (model.multiView ? multiFiles.front?.name : singleFile?.name)
                   ?.replace(/\.[^.]+$/, '') || 'model';
    setStatus('Done!');
    showResult(glbUrl);

  } catch (e) {
    const detail = e.body ? JSON.stringify(e.body) : (e.message || String(e));
    setError('Error: ' + detail);
    document.getElementById('generate-btn').disabled = false;
  }
}

// ---- Three.js preview -----------------------------------------------------
let renderer, scene, camera, controls;

function initRenderer() {
  const canvas = document.getElementById('preview-canvas');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const w = canvas.parentElement.clientWidth;
  renderer.setSize(w, Math.round(w * 0.75));
  renderer.setPixelRatio(window.devicePixelRatio);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, 4 / 3, 0.01, 100);
  camera.position.set(0, 0.5, 2);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.0));
  const dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(5, 10, 7); scene.add(dir);
  controls = new OrbitControls(camera, canvas);
  controls.target.set(0, 0, 0); controls.update();
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
}

function showResult(glbUrl) {
  document.getElementById('result-section').style.display = '';
  if (!renderer) initRenderer();
  scene.children.filter(c => c.userData.isModel).forEach(c => scene.remove(c));
  new GLTFLoader().load(glbUrl, gltf => {
    const model = gltf.scene;
    model.userData.isModel = true;
    const box = new THREE.Box3().setFromObject(model);
    model.position.sub(box.getCenter(new THREE.Vector3()));
    model.scale.setScalar(1.5 / box.getSize(new THREE.Vector3()).length());
    scene.add(model); controls.target.set(0, 0, 0); controls.update();
  }, undefined, e => setError('Preview failed: ' + e.message));
}

// ---- result actions -------------------------------------------------------
document.getElementById('ar-btn').addEventListener('click', () => {
  if (!resultGlbUrl) return;
  const url = new URL('/ar-live.html', location.href);
  url.searchParams.set('glb', resultGlbUrl);
  url.searchParams.set('name', resultName);
  location.href = url.toString();
});

document.getElementById('save-btn').addEventListener('click', () => {
  if (!resultGlbUrl) return;
  const library = JSON.parse(localStorage.getItem('ar_library') || '[]');
  library.push({
    id: 'gen-' + Date.now(),
    name: resultName,
    category: 'Generated',
    thumbnail_url: null,
    ar_url: '/ar-live.html?glb=' + encodeURIComponent(resultGlbUrl) + '&name=' + encodeURIComponent(resultName),
    glb_local_url: resultGlbUrl,
    usdz_local_url: null,
    savedAt: new Date().toISOString(),
  });
  localStorage.setItem('ar_library', JSON.stringify(library));
  document.getElementById('save-btn').textContent = 'Saved ✓';
  document.getElementById('save-btn').disabled = true;
});
</script>
</body>
</html>
